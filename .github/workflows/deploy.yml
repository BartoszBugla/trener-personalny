# Tests every push and PR. On main: builds the Docker image here, copies it
# to the server over SSH and restarts the app there.
#
# Repo → Settings → Secrets and variables → Actions
#   Secrets:
#     SSH_HOST          2.29.139.62
#     SSH_PRIVATE_KEY   contents of ~/.ssh/trener_deploy_ci
#     SSH_KNOWN_HOSTS   output of: ssh-keyscan -t ed25519 2.29.139.62
#   Variables (public Firebase web config, baked into the client bundle):
#     VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN,
#     VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_APP_ID
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      SERVER: root@${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t trener-personalny:latest \
            --build-arg VITE_FIREBASE_API_KEY="${{ vars.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ vars.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ vars.VITE_FIREBASE_APP_ID }}" \
            .

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Copy image and config to server
        run: |
          docker save trener-personalny:latest | gzip | ssh $SERVER docker load
          scp docker-compose.yml Caddyfile $SERVER:/opt/trener/app/

      - name: Restart app
        run: ssh $SERVER "cd /opt/trener/app && docker compose up -d --no-build --wait && docker image prune -f"
