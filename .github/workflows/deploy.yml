# Tests every push and PR. On main: builds the Docker image here, copies it
# and the production .env to the server over SSH, and restarts the app.
#
# Repo → Settings → Environments → Production (deployment branch: main) → Secrets:
#   ENV_FILE          the whole production .env (Firebase, AUTH_*, DOMAIN, VITE_* …)
#   SSH_HOST          2.29.139.62
#   SSH_PRIVATE_KEY   contents of ~/.ssh/trener_deploy_ci
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:check

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: Production
    concurrency: deploy
    env:
      SERVER: root@${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then echo "ENV_FILE secret is not set" >&2; exit 1; fi
          printf '%s\n' "$ENV_FILE" > .env
          docker compose config --quiet  # fail here, not on the server, if .env is malformed

      - name: Build image
        run: docker build --secret id=env,src=.env -t trener-personalny:latest .

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          # Server's public host key (not a secret) – protects against MITM.
          echo "${{ secrets.SSH_HOST }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGyzxiZcpxFtSp0I37WT/2NEBdDcQGUx+1QTQ2uu5f0c" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Copy image, .env and config to server
        run: |
          docker save trener-personalny:latest | gzip | ssh $SERVER docker load
          scp .env docker-compose.yml Caddyfile $SERVER:/opt/trener/app/

      - name: Restart app
        run: ssh $SERVER "cd /opt/trener/app && chmod 600 .env && docker compose up -d --no-build --wait && docker image prune -f"
