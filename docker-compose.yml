# Production stack: app + Caddy (automatic HTTPS).
# Expects ./.env next to this file (secrets + DOMAIN); CI writes it from the
# ENV_FILE GitHub secret on every deploy.
# Deployed by GitHub Actions (.github/workflows/deploy.yml).
services:
  app:
    build:
      context: .
      secrets: [env]
    image: trener-personalny:latest
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: /data/app.db
    volumes:
      - /opt/trener/data:/data
      - /opt/trener/calendars:/calendars:ro
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

secrets:
  env:
    file: .env
